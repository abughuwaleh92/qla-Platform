<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Lesson Presenter - QLA Mathematics LMS</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  
  <style>
    :root{
      --maroon:#6C1D45; --gold:#C7A34F;
    }
    
    .presenter-mode {
      background: #1a1a1a;
    }
    
    .control-panel {
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(10px);
    }
    
    .student-indicator {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 12px;
      border: 2px solid transparent;
      transition: all 0.3s;
    }
    
    .student-indicator.active {
      background: #22c55e;
      color: white;
      border-color: #16a34a;
    }
    
    .student-indicator.struggling {
      background: #f59e0b;
      color: white;
      animation: pulse 2s infinite;
    }
    
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    
    .lesson-viewport {
      background: white;
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      overflow: hidden;
    }
    
    .toolbar-btn {
      padding: 10px 15px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s;
    }
    
    .toolbar-btn:hover {
      background: rgba(255,255,255,0.2);
    }
    
    .toolbar-btn.active {
      background: var(--gold);
      color: var(--maroon);
      border-color: var(--gold);
    }
  </style>
</head>
<body class="presenter-mode">

  <!-- Top Control Bar -->
  <div class="control-panel fixed top-0 left-0 right-0 h-20 z-50 px-6 py-4">
    <div class="flex items-center justify-between h-full">
      <!-- Left: Lesson Info -->
      <div class="flex items-center gap-4">
        <button onclick="exitPresenter()" class="text-white hover:text-gray-300">
          <i class="fas fa-arrow-left text-xl"></i>
        </button>
        <div class="text-white">
          <h1 class="text-xl font-bold" id="lessonTitle">Loading...</h1>
          <p class="text-sm opacity-80">
            <span id="currentSlide">1</span> / <span id="totalSlides">--</span>
            • <span id="connectedStudents">0</span> students connected
          </p>
        </div>
      </div>
      
      <!-- Center: Presentation Controls -->
      <div class="flex items-center gap-2">
        <button onclick="previousSlide()" class="toolbar-btn">
          <i class="fas fa-chevron-left"></i>
        </button>
        
        <button onclick="togglePointer()" id="pointerBtn" class="toolbar-btn">
          <i class="fas fa-hand-pointer"></i>
        </button>
        
        <button onclick="toggleDraw()" id="drawBtn" class="toolbar-btn">
          <i class="fas fa-pen"></i>
        </button>
        
        <button onclick="toggleHighlight()" id="highlightBtn" class="toolbar-btn">
          <i class="fas fa-highlighter"></i>
        </button>
        
        <button onclick="clearAnnotations()" class="toolbar-btn">
          <i class="fas fa-eraser"></i>
        </button>
        
        <button onclick="nextSlide()" class="toolbar-btn">
          <i class="fas fa-chevron-right"></i>
        </button>
      </div>
      
      <!-- Right: Actions -->
      <div class="flex items-center gap-3">
        <button onclick="toggleStudentView()" class="toolbar-btn">
          <i class="fas fa-users"></i> Student View
        </button>
        
        <button onclick="lockLesson()" id="lockBtn" class="toolbar-btn">
          <i class="fas fa-lock"></i> Lock Progress
        </button>
        
        <button onclick="startPoll()" class="toolbar-btn">
          <i class="fas fa-poll"></i> Quick Poll
        </button>
        
        <button onclick="toggleFullscreen()" class="toolbar-btn">
          <i class="fas fa-expand"></i>
        </button>
      </div>
    </div>
  </div>

  <!-- Main Content Area -->
  <div class="flex h-screen pt-20">
    <!-- Lesson Display -->
    <div class="flex-1 p-6">
      <div class="lesson-viewport h-full relative">
        <iframe id="lessonFrame" class="w-full h-full border-0"></iframe>
        
        <!-- Drawing Canvas Overlay -->
        <canvas id="annotationCanvas" class="absolute inset-0 pointer-events-none" style="display:none;"></canvas>
        
        <!-- Pointer Indicator -->
        <div id="pointerIndicator" class="absolute w-8 h-8 bg-red-500 rounded-full opacity-75" style="display:none; transform: translate(-50%, -50%);"></div>
      </div>
    </div>
    
    <!-- Right Sidebar: Student Monitor -->
    <div id="studentPanel" class="w-80 bg-gray-900 p-4 overflow-y-auto">
      <h2 class="text-white font-bold mb-4">Student Progress</h2>
      
      <!-- Class Overview -->
      <div class="bg-gray-800 rounded-lg p-4 mb-4">
        <div class="grid grid-cols-2 gap-4">
          <div>
            <p class="text-gray-400 text-xs">Avg Progress</p>
            <p class="text-white text-2xl font-bold" id="avgProgress">0%</p>
          </div>
          <div>
            <p class="text-gray-400 text-xs">Avg Score</p>
            <p class="text-white text-2xl font-bold" id="avgScore">--</p>
          </div>
        </div>
      </div>
      
      <!-- Individual Students -->
      <div class="space-y-2" id="studentList">
        <!-- Students will be added here dynamically -->
      </div>
      
      <!-- Quick Actions -->
      <div class="mt-6 space-y-2">
        <button onclick="sendToAll('hint')" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">
          <i class="fas fa-lightbulb"></i> Send Hint to All
        </button>
        
        <button onclick="pauseAll()" class="w-full bg-yellow-600 text-white py-2 rounded-lg hover:bg-yellow-700">
          <i class="fas fa-pause"></i> Pause All Students
        </button>
        
        <button onclick="releaseAll()" class="w-full bg-green-600 text-white py-2 rounded-lg hover:bg-green-700">
          <i class="fas fa-play"></i> Release All
        </button>
      </div>
    </div>
  </div>

  <!-- Poll Modal -->
  <div id="pollModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-lg p-6 max-w-md w-full">
      <h3 class="text-xl font-bold mb-4">Quick Poll</h3>
      
      <input type="text" id="pollQuestion" placeholder="Enter your question..." 
             class="w-full px-4 py-2 border rounded-lg mb-4">
      
      <div id="pollOptions" class="space-y-2 mb-4">
        <input type="text" placeholder="Option A" class="poll-option w-full px-4 py-2 border rounded-lg">
        <input type="text" placeholder="Option B" class="poll-option w-full px-4 py-2 border rounded-lg">
      </div>
      
      <button onclick="addPollOption()" class="text-blue-600 hover:text-blue-700 mb-4">
        <i class="fas fa-plus"></i> Add Option
      </button>
      
      <div class="flex gap-2">
        <button onclick="launchPoll()" class="flex-1 bg-[#6C1D45] text-white py-2 rounded-lg">
          Launch Poll
        </button>
        <button onclick="closePoll()" class="flex-1 bg-gray-300 py-2 rounded-lg">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <!-- Poll Results -->
  <div id="pollResults" class="fixed bottom-4 right-4 bg-white rounded-lg shadow-xl p-4 w-80 hidden">
    <h4 class="font-bold mb-2">Poll Results</h4>
    <div id="pollResultsContent"></div>
    <button onclick="closePollResults()" class="mt-2 text-sm text-gray-500">Close</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    // Global variables
    let socket;
    let currentLesson;
    let students = new Map();
    let drawMode = false;
    let pointerMode = false;
    let highlightMode = false;
    let isLocked = false;
    let canvas, ctx;

    // Initialize
    function init() {
      // Get lesson ID from URL params
      const params = new URLSearchParams(window.location.search);
      const lessonId = params.get('lesson');
      
      if (!lessonId) {
        alert('No lesson specified');
        window.location.href = '/dashboard';
        return;
      }

      // Initialize WebSocket
      if (typeof io !== 'undefined') {
        socket = io();
        setupSocketHandlers();
        
        // Join presenter room
        socket.emit('presenter-join', { lessonId, teacherId: getCurrentTeacherId() });
      }

      // Load lesson
      loadLesson(lessonId);
      
      // Setup canvas
      setupAnnotationCanvas();
      
      // Setup keyboard shortcuts
      setupKeyboardShortcuts();
    }

    function setupSocketHandlers() {
      socket.on('student-joined', (data) => {
        addStudent(data.studentId, data.studentName);
        updateStudentCount();
      });

      socket.on('student-left', (data) => {
        removeStudent(data.studentId);
        updateStudentCount();
      });

      socket.on('student-progress', (data) => {
        updateStudentProgress(data.studentId, data.progress);
      });

      socket.on('student-interaction', (data) => {
        handleStudentInteraction(data);
      });

      socket.on('poll-response', (data) => {
        updatePollResults(data);
      });

      socket.on('student-question', (data) => {
        showStudentQuestion(data);
      });
    }

    async function loadLesson(lessonId) {
      try {
        const response = await fetch(`/api/lessons/${lessonId}`);
        currentLesson = await response.json();
        
        document.getElementById('lessonTitle').textContent = currentLesson.title;
        
        // Load lesson content
        const frame = document.getElementById('lessonFrame');
        
        // Try to load the lesson file
        const lessonUrl = `/lessons/grade${currentLesson.grade}/lesson-${currentLesson.unit}-${currentLesson.lesson_order}.html`;
        
        // Check if file exists
        const fileResponse = await fetch(lessonUrl);
        if (fileResponse.ok) {
          frame.src = lessonUrl;
        } else {
          // Load from HTML content
          frame.srcdoc = currentLesson.html_content || '<p>No content available</p>';
        }
        
        // Listen for messages from lesson
        window.addEventListener('message', handleLessonMessage);
      } catch (error) {
        console.error('Error loading lesson:', error);
        alert('Failed to load lesson');
      }
    }

    function handleLessonMessage(event) {
      if (event.data.source !== 'lesson-bridge') return;
      
      const data = event.data;
      
      // Update slide info
      if (data.type === 'lesson-ready' || data.type === 'slide-change') {
        document.getElementById('currentSlide').textContent = data.slide || 1;
        document.getElementById('totalSlides').textContent = data.total || 1;
        
        // Broadcast to students
        if (socket) {
          socket.emit('presenter-slide-change', {
            lessonId: currentLesson.id,
            slide: data.slide
          });
        }
      }
    }

    function setupAnnotationCanvas() {
      canvas = document.getElementById('annotationCanvas');
      ctx = canvas.getContext('2d');
      
      // Set canvas size
      function resizeCanvas() {
        const viewport = document.querySelector('.lesson-viewport');
        canvas.width = viewport.clientWidth;
        canvas.height = viewport.clientHeight;
      }
      
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);
      
      // Drawing functionality
      let isDrawing = false;
      let lastX = 0;
      let lastY = 0;
      
      canvas.addEventListener('mousedown', (e) => {
        if (!drawMode && !highlightMode) return;
        
        isDrawing = true;
        [lastX, lastY] = [e.offsetX, e.offsetY];
      });
      
      canvas.addEventListener('mousemove', (e) => {
        if (!isDrawing) return;
        
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(e.offsetX, e.offsetY);
        
        if (highlightMode) {
          ctx.strokeStyle = 'rgba(255, 255, 0, 0.3)';
          ctx.lineWidth = 20;
        } else {
          ctx.strokeStyle = '#FF0000';
          ctx.lineWidth = 3;
        }
        
        ctx.stroke();
        [lastX, lastY] = [e.offsetX, e.offsetY];
        
        // Broadcast drawing to students
        if (socket) {
          socket.emit('presenter-draw', {
            lessonId: currentLesson.id,
            from: { x: lastX, y: lastY },
            to: { x: e.offsetX, y: e.offsetY },
            style: highlightMode ? 'highlight' : 'pen'
          });
        }
      });
      
      canvas.addEventListener('mouseup', () => {
        isDrawing = false;
      });
      
      canvas.addEventListener('mouseout', () => {
        isDrawing = false;
      });
    }

    function setupKeyboardShortcuts() {
      document.addEventListener('keydown', (e) => {
        switch(e.key) {
          case 'ArrowLeft':
            previousSlide();
            break;
          case 'ArrowRight':
            nextSlide();
            break;
          case 'p':
            togglePointer();
            break;
          case 'd':
            toggleDraw();
            break;
          case 'h':
            toggleHighlight();
            break;
          case 'c':
            clearAnnotations();
            break;
          case 'l':
            lockLesson();
            break;
          case 'f':
            toggleFullscreen();
            break;
        }
      });
    }

    // Navigation functions
    function previousSlide() {
      const frame = document.getElementById('lessonFrame');
      frame.contentWindow.postMessage({ action: 'previousSlide' }, '*');
    }

    function nextSlide() {
      const frame = document.getElementById('lessonFrame');
      frame.contentWindow.postMessage({ action: 'nextSlide' }, '*');
    }

    // Tool functions
    function togglePointer() {
      pointerMode = !pointerMode;
      document.getElementById('pointerBtn').classList.toggle('active', pointerMode);
      
      const pointer = document.getElementById('pointerIndicator');
      pointer.style.display = pointerMode ? 'block' : 'none';
      
      if (pointerMode) {
        drawMode = false;
        highlightMode = false;
        document.getElementById('drawBtn').classList.remove('active');
        document.getElementById('highlightBtn').classList.remove('active');
        canvas.style.display = 'none';
        
        // Track mouse for pointer
        document.addEventListener('mousemove', updatePointer);
      } else {
        document.removeEventListener('mousemove', updatePointer);
      }
    }

    function updatePointer(e) {
      const viewport = document.querySelector('.lesson-viewport');
      const rect = viewport.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      
      const pointer = document.getElementById('pointerIndicator');
      pointer.style.left = `${x}px`;
      pointer.style.top = `${y}px`;
      
      // Broadcast pointer position
      if (socket) {
        socket.emit('presenter-pointer', {
          lessonId: currentLesson.id,
          x: x / rect.width,
          y: y / rect.height
        });
      }
    }

    function toggleDraw() {
      drawMode = !drawMode;
      document.getElementById('drawBtn').classList.toggle('active', drawMode);
      
      if (drawMode) {
        canvas.style.display = 'block';
        canvas.style.pointerEvents = 'auto';
        highlightMode = false;
        pointerMode = false;
        document.getElementById('highlightBtn').classList.remove('active');
        document.getElementById('pointerBtn').classList.remove('active');
      } else {
        canvas.style.pointerEvents = 'none';
      }
    }

    function toggleHighlight() {
      highlightMode = !highlightMode;
      document.getElementById('highlightBtn').classList.toggle('active', highlightMode);
      
      if (highlightMode) {
        canvas.style.display = 'block';
        canvas.style.pointerEvents = 'auto';
        drawMode = false;
        pointerMode = false;
        document.getElementById('drawBtn').classList.remove('active');
        document.getElementById('pointerBtn').classList.remove('active');
      } else {
        canvas.style.pointerEvents = 'none';
      }
    }

    function clearAnnotations() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Broadcast clear to students
      if (socket) {
        socket.emit('presenter-clear-annotations', {
          lessonId: currentLesson.id
        });
      }
    }

    // Student management
    function addStudent(studentId, studentName) {
      students.set(studentId, {
        id: studentId,
        name: studentName,
        progress: 0,
        score: null,
        status: 'active'
      });
      
      updateStudentList();
    }

    function removeStudent(studentId) {
      students.delete(studentId);
      updateStudentList();
    }

    function updateStudentProgress(studentId, progress) {
      const student = students.get(studentId);
      if (student) {
        student.progress = progress;
        updateStudentList();
        updateClassStats();
      }
    }

    function updateStudentList() {
      const container = document.getElementById('studentList');
      container.innerHTML = '';
      
      students.forEach(student => {
        const studentEl = document.createElement('div');
        studentEl.className = 'bg-gray-800 rounded-lg p-3';
        studentEl.innerHTML = `
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-3">
              <div class="student-indicator ${student.progress < 50 ? 'struggling' : 'active'}">
                ${student.name.charAt(0).toUpperCase()}
              </div>
              <div>
                <p class="text-white font-semibold">${student.name}</p>
                <p class="text-gray-400 text-xs">Progress: ${student.progress}%</p>
              </div>
            </div>
            <button onclick="helpStudent('${student.id}')" class="text-yellow-500 hover:text-yellow-400">
              <i class="fas fa-hand-paper"></i>
            </button>
          </div>
        `;
        container.appendChild(studentEl);
      });
    }

    function updateClassStats() {
      let totalProgress = 0;
      let totalScore = 0;
      let scoreCount = 0;
      
      students.forEach(student => {
        totalProgress += student.progress;
        if (student.score !== null) {
          totalScore += student.score;
          scoreCount++;
        }
      });
      
      const avgProgress = students.size > 0 ? Math.round(totalProgress / students.size) : 0;
      const avgScore = scoreCount > 0 ? Math.round(totalScore / scoreCount) : '--';
      
      document.getElementById('avgProgress').textContent = `${avgProgress}%`;
      document.getElementById('avgScore').textContent = avgScore === '--' ? '--' : `${avgScore}%`;
    }

    function updateStudentCount() {
      document.getElementById('connectedStudents').textContent = students.size;
    }

    // Lesson control
    function lockLesson() {
      isLocked = !isLocked;
      const btn = document.getElementById('lockBtn');
      
      if (isLocked) {
        btn.innerHTML = '<i class="fas fa-unlock"></i> Unlock';
        btn.classList.add('active');
      } else {
        btn.innerHTML = '<i class="fas fa-lock"></i> Lock Progress';
        btn.classList.remove('active');
      }
      
      // Broadcast lock status
      if (socket) {
        socket.emit('presenter-lock', {
          lessonId: currentLesson.id,
          locked: isLocked
        });
      }
    }

    function toggleStudentView() {
      const panel = document.getElementById('studentPanel');
      panel.classList.toggle('hidden');
    }

    // Poll functions
    function startPoll() {
      document.getElementById('pollModal').style.display = 'flex';
    }

    function addPollOption() {
      const container = document.getElementById('pollOptions');
      const optionCount = container.children.length;
      const newOption = document.createElement('input');
      newOption.type = 'text';
      newOption.className = 'poll-option w-full px-4 py-2 border rounded-lg';
      newOption.placeholder = `Option ${String.fromCharCode(65 + optionCount)}`;
      container.appendChild(newOption);
    }

    function launchPoll() {
      const question = document.getElementById('pollQuestion').value;
      const options = Array.from(document.querySelectorAll('.poll-option'))
        .map(input => input.value)
        .filter(value => value.trim() !== '');
      
      if (!question || options.length < 2) {
        alert('Please enter a question and at least 2 options');
        return;
      }
      
      // Broadcast poll to students
      if (socket) {
        socket.emit('presenter-poll', {
          lessonId: currentLesson.id,
          question,
          options
        });
      }
      
      // Reset poll results
      pollResults = new Map();
      options.forEach((_, index) => pollResults.set(index, 0));
      
      closePoll();
      showPollResults();
    }

    function closePoll() {
      document.getElementById('pollModal').style.display = 'none';
    }

    let pollResults = new Map();

    function updatePollResults(data) {
      pollResults.set(data.option, (pollResults.get(data.option) || 0) + 1);
      displayPollResults();
    }

    function displayPollResults() {
      const container = document.getElementById('pollResultsContent');
      const total = Array.from(pollResults.values()).reduce((a, b) => a + b, 0);
      
      let html = '';
      pollResults.forEach((count, option) => {
        const percentage = total > 0 ? Math.round((count / total) * 100) : 0;
        html += `
          <div class="mb-2">
            <div class="flex justify-between text-sm">
              <span>Option ${String.fromCharCode(65 + option)}</span>
              <span>${count} (${percentage}%)</span>
            </div>
            <div class="bg-gray-200 rounded-full h-4 overflow-hidden">
              <div class="bg-[#6C1D45] h-full transition-all" style="width: ${percentage}%"></div>
            </div>
          </div>
        `;
      });
      
      container.innerHTML = html;
    }

    function showPollResults() {
      document.getElementById('pollResults').classList.remove('hidden');
      displayPollResults();
    }

    function closePollResults() {
      document.getElementById('pollResults').classList.add('hidden');
    }

    // Helper functions
    function helpStudent(studentId) {
      // Send help notification to specific student
      if (socket) {
        socket.emit('presenter-help-student', {
          lessonId: currentLesson.id,
          studentId
        });
      }
      
      // Visual feedback
      const student = students.get(studentId);
      if (student) {
        showNotification(`Helping ${student.name}`, 'info');
      }
    }

    function sendToAll(type) {
      if (socket) {
        socket.emit('presenter-broadcast', {
          lessonId: currentLesson.id,
          type,
          message: type === 'hint' ? 'Check the highlighted section' : ''
        });
      }
      
      showNotification(`${type} sent to all students`, 'success');
    }

    function pauseAll() {
      if (socket) {
        socket.emit('presenter-pause-all', {
          lessonId: currentLesson.id
        });
      }
      
      showNotification('All students paused', 'warning');
    }

    function releaseAll() {
      if (socket) {
        socket.emit('presenter-release-all', {
          lessonId: currentLesson.id
        });
      }
      
      showNotification('All students released', 'success');
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        document.exitFullscreen();
      }
    }

    function showStudentQuestion(data) {
      const notification = document.createElement('div');
      notification.className = 'fixed bottom-4 left-4 bg-white rounded-lg shadow-xl p-4 max-w-md';
      notification.innerHTML = `
        <div class="flex items-start gap-3">
          <div class="text-blue-500">
            <i class="fas fa-question-circle text-2xl"></i>
          </div>
          <div>
            <p class="font-bold">${data.studentName} asks:</p>
            <p class="text-gray-700">${data.question}</p>
            <button onclick="this.parentElement.parentElement.parentElement.remove()" 
                    class="mt-2 text-sm text-gray-500">Dismiss</button>
          </div>
        </div>
      `;
      
      document.body.appendChild(notification);
      
      setTimeout(() => {
        if (document.body.contains(notification)) {
          notification.remove();
        }
      }, 10000);
    }

    function showNotification(message, type = 'info') {
      const notification = document.createElement('div');
      notification.className = `fixed top-24 right-4 px-6 py-3 rounded-lg text-white z-50 ${
        type === 'success' ? 'bg-green-500' :
        type === 'warning' ? 'bg-yellow-500' :
        type === 'error' ? 'bg-red-500' :
        'bg-blue-500'
      }`;
      notification.textContent = message;
      
      document.body.appendChild(notification);
      
      setTimeout(() => {
        notification.remove();
      }, 3000);
    }

    function exitPresenter() {
